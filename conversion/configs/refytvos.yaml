# Ref-YouTube-VOS: optical flow (DIS-HQ) + linear generator, c=5 — camera-ready config (Event-SAMA paper, Table 1)
# Paths come from the command line: python convert.py --config configs/refytvos_camera_ready.yaml --input <rgb root> --output <events root>
# sanity_clips are relative to --input.

dataset: refytvos
mode: frames
fps: 24
upsample: dis_hq
target_fps: 200
target_size: [1024, 1024]
c_pos: 5
c_neg: 5
chunk_frames_cpu: 50
sanity_clips:
  - 6c9e3b7d1a
  - 6ca006e283
  - 58163c37cd
