# ReVOS / TAO: optical flow (DIS-HQ) + linear generator, c=3 — camera-ready config (Event-SAMA paper, Table 1)
# Paths come from the command line: python convert.py --config configs/revos_tao_normal_camera_ready.yaml --input <rgb root> --output <events root>
# sanity_clips are relative to --input.

dataset: revos_tao
mode: frames
fps: 30
subdir_levels: 1            # clip id includes the TAO subset, e.g. Charades/<clip>
upsample: dis_hq
target_fps: 200
c_pos: 3
c_neg: 3
chunk_frames_cpu: 50
sanity_clips:
  - test/Charades/AAS9S
  - test/Charades/ADCTG
  - test/Charades/AHLZY
