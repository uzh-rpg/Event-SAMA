# ReVOS / OVIS: optical flow (DIS-HQ) + linear generator, c=3 — camera-ready config (Event-SAMA paper, Table 1)
# Paths come from the command line: python convert.py --config configs/revos_ovis_normal_camera_ready.yaml --input <rgb root> --output <events root>
# sanity_clips are relative to --input.

dataset: revos_ovis
mode: frames
fps: 30
upsample: dis_hq
target_fps: 200
c_pos: 3
c_neg: 3
chunk_frames_cpu: 50
sanity_clips:
  - train/00e92ab4
  - train/0b02886a
  - train/0b4b662c
