# LV-VIS: optical flow (DIS-HQ) + linear generator, c=3 — camera-ready config (Event-SAMA paper, Table 1)
# Paths come from the command line: python convert.py --config configs/lvvis_camera_ready.yaml --input <rgb root> --output <events root>
# sanity_clips are relative to --input.

dataset: lvvis
mode: frames
fps: 24
upsample: dis_hq
target_fps: 200
c_pos: 3
c_neg: 3
chunk_frames_cpu: 50
sanity_clips:
  - "00004"
  - "00005"
  - "00006"
