# ReVOS / UVO: optical flow (DIS-HQ) + linear generator, c=3 — camera-ready config (Event-SAMA paper, Table 1)
# Paths come from the command line: python convert.py --config configs/revos_uvo_normal_camera_ready.yaml --input <rgb root> --output <events root>
# sanity_clips are relative to --input.

dataset: revos_uvo
mode: video
upsample: dis_hq
target_fps: 200
c_pos: 3
c_neg: 3
chunk_frames_cpu: 50
sanity_clips:
  - "-3Ck7V6iqPk.f134"
  - "-2JgjPsy4Eo.f136"
  - "-3cl74lG6T4.f134"
